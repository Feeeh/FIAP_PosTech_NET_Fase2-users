name: Integração contínua
on: [push, pull_request]
permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ${{ secrets.FCG_TEST_SQLSERVER_PASSWORD }}
        ports: [1433:1433]
        options: >-
          --health-cmd='/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"'
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FCG_TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=${{ secrets.FCG_TEST_SQLSERVER_PASSWORD }};TrustServerCertificate=True;Encrypt=False
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Fcg.Users.slnx
      - run: dotnet build Fcg.Users.slnx -c Release --no-restore
      - run: dotnet test Fcg.Users.slnx -c Release --no-build
      - run: docker build -t fcg/users-api:1.0 .
