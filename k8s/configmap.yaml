apiVersion: v1
kind: ConfigMap
metadata:
  name: users-api-config
  namespace: fcg
  labels:
    app: users-api
    app.kubernetes.io/part-of: fcg
data:
  ASPNETCORE_ENVIRONMENT: Production
  RabbitMq__Host: rabbitmq
  RabbitMq__Porta: "5672"
  RabbitMq__Exchange: fcg.events
  RabbitMq__ExchangeDeMensagensMortas: fcg.events.dlx
  RabbitMq__NomeDaAplicacao: users-api
  Swagger__Habilitado: "true"
  Jwt__Emissor: fcg-users-api
  Jwt__Audiencia: fcg-clientes
  Jwt__MinutosDeValidade: "60"
